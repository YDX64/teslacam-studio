<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaCam Studio — view, scrub, snapshot, and export Tesla dashcam and Sentry clips." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TeslaCam Studio</title>
    <style>
      /* Custom seek slider — needed because Tailwind can't easily target ::-webkit-slider-thumb */
      .seek-slider {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: linear-gradient(
          to right,
          var(--color-accent) 0,
          var(--color-accent) var(--progress, 0%),
          rgba(255, 255, 255, 0.08) var(--progress, 0%),
          rgba(255, 255, 255, 0.08) 100%
        );
        border-radius: 999px;
        outline: none;
        cursor: pointer;
      }
      .seek-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        border: 3px solid var(--color-accent);
        box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.25),
                    0 2px 8px rgba(91, 141, 239, 0.5);
        cursor: pointer;
        transition: transform 120ms ease;
      }
      .seek-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
      .seek-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        border: 3px solid var(--color-accent);
        cursor: pointer;
      }

      /* Tesla portrait — large slider so it's easy to grab with a finger */
      .tesla-seek {
        -webkit-appearance: none;
        appearance: none;
        height: 14px;
        background: linear-gradient(
          to right,
          var(--color-accent) 0,
          var(--color-accent) var(--progress, 0%),
          rgba(255, 255, 255, 0.10) var(--progress, 0%),
          rgba(255, 255, 255, 0.10) 100%
        );
        border-radius: 999px;
        outline: none;
        cursor: pointer;
      }
      .tesla-seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: white;
        border: 5px solid var(--color-accent);
        box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.30),
                    0 4px 12px rgba(91, 141, 239, 0.55);
        cursor: pointer;
      }
      .tesla-seek::-moz-range-thumb {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: white;
        border: 5px solid var(--color-accent);
        cursor: pointer;
      }
      details > summary::-webkit-details-marker { display: none; }
      details > summary { list-style: none; }
      /* Initial loading skeleton — appears before React mounts */
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(800px 400px at 50% 50%, rgba(91, 141, 239, 0.18), transparent 70%),
          #0a0d14;
      }
      #root:empty::after {
        content: "TeslaCam Studio";
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.4);
        font: 500 13px/1.4 system-ui, -apple-system, sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
